<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

  <!-- Gear -->
  <g transform="translate(256,256)">
    <!-- dientes -->
    <g fill="#666" stroke="#111" stroke-width="6">
      <rect x="-20" y="-230" width="40" height="60" rx="8"/>
      <rect x="-20" y="-230" width="40" height="60" rx="8" transform="rotate(30)"/>
      <rect x="-20" y="-230" width="40" height="60" rx="8" transform="rotate(60)"/>
      <rect x="-20" y="-230" width="40" height="60" rx="8" transform="rotate(90)"/>
      <rect x="-20" y="-230" width="40" height="60" rx="8" transform="rotate(120)"/>
      <rect x="-20" y="-230" width="40" height="60" rx="8" transform="rotate(150)"/>
      <rect x="-20" y="-230" width="40" height="60" rx="8" transform="rotate(180)"/>
      <rect x="-20" y="-230" width="40" height="60" rx="8" transform="rotate(210)"/>
      <rect x="-20" y="-230" width="40" height="60" rx="8" transform="rotate(240)"/>
      <rect x="-20" y="-230" width="40" height="60" rx="8" transform="rotate(270)"/>
      <rect x="-20" y="-230" width="40" height="60" rx="8" transform="rotate(300)"/>
      <rect x="-20" y="-230" width="40" height="60" rx="8" transform="rotate(330)"/>
    </g>

    <!-- anillo -->
    <circle r="200" fill="#555" stroke="#111" stroke-width="12"/>
    <circle r="150" fill="#777"/>
  </g>

  <!-- Pokéball con borde -->
  <g>
    <!-- borde exterior -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="#000" stroke-width="10"/>

    <!-- superior -->
    <path d="M96 256 A160 160 0 0 1 416 256 L256 256 Z" fill="#e53935"/>
    
    <!-- inferior -->
    <path d="M96 256 A160 160 0 0 0 416 256 L256 256 Z" fill="#f2f2f2"/>

    <!-- línea -->
    <rect x="96" y="244" width="320" height="24" fill="#000"/>

    <!-- botón -->
    <circle cx="256" cy="256" r="36" fill="#ddd" stroke="#000" stroke-width="8"/>
    <circle cx="256" cy="256" r="16" fill="#bbb"/>
  </g>

</svg>
